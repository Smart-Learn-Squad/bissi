[package]
name = "bissi-backend"
version = "0.1.0"
edition = "2021"
description = "BISSI local-first AI agent backend (Rust). Proxies llama.cpp :8001, serves SSE/WS to Electron :8765."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
